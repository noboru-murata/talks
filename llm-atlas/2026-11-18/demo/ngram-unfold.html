<script>
'use strict';
(() => {
const D = window.NGRAM_UNFOLD;
if (!D) { document.body.innerHTML = '<p style="padding:20px">ngram-unfold-data.js がありません (python3 code/ngram_unfold.py で作る)．</p>'; return; }
const V = D.vocab.length, R = D.rows.length, NO = D.obj.length;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.append(e); return e; };
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
const motion = matchMedia('(prefers-reduced-motion: reduce)');
// 明暗: 色の両端と文字の色を明暗で替える (明暗の切替は右下の button．OS の設定にも従う)
let DK = false;
const readTheme = () => { DK = getComputedStyle(document.documentElement).colorScheme === 'dark'; };
readTheme();
const RAMP = () => DK ? [[38, 42, 40], [96, 214, 172]] : [[242, 246, 237], [29, 107, 86]];
const toneArr = v => { const [LO, HI] = RAMP(), t = Math.max(0, Math.min(1, v / D.colorMax)); return LO.map((a, i) => Math.round(a + (HI[i] - a) * t)); };
const tone = v => `rgb(${toneArr(v).join(',')})`;
const high = v => v / D.colorMax > .55;
const ink = v => high(v) ? (DK ? '#0b0b0b' : '#fff') : (DK ? '#e8e8e4' : '#333');
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const holeSet = new Set(D.holes.map(([i, j]) => i + ',' + j));
const isHole = (i, j) => holeSet.has(i + ',' + j);
const objCol = D.obj.map(o => D.vocab.indexOf(o));               // 目的語の列 (語彙の番号)
const rowOfIndex = new Map(D.rowIndex.map((ri, i) => [ri, i]));    // 展開した行の番号 → 観測した行の番号

// ---------------------------------------------------------------- 場面
const stages = ['2-gram の表', '3-gram の配列', '1 列に展開', 'ほとんど空', '並べ替える', '座標に置く', '間隔を伸縮', '表に戻す', '点と矢印', '付録 積と softmax'];
const titles = [
  '2-gram は，直前の語と次の語の 2 次元の配列',
  '3-gram は，直前の 2 語と次の語の 3 次元の配列',
  '直前の 2 語を 1 列に並べると，2-gram と同じ 2 次元の表になる',
  '展開した表は非常に長く，ほとんどが空',
  '行と列を並べ替えると，観測された行が集まり傾向が見える',
  '行と列に座標を当て，格子点の間をつなぐ',
  '軸の間隔を伸び縮みさせると，滑らかな簡単な関数で近似できる',
  '関数から読み直すと，穴にも，表に無い文脈にも値が入る',
  '表の 1 行を，語の点と文脈の矢印の内積で書く',
  '付録: 2 次関数で書くと，正規化で xy の項が残る'];
const prompts = [
  `語彙は ${V} 語 (主語・動詞・目的語)．p(y | w₁) の表は ${V} × ${V}．行と列は辞書順で，並べ替える前の順番です．色が濃いほど確率が高く，灰色は一度も出てこなかった組です．`,
  `p(y | w₁, w₂) は ${V} × ${V} × ${V} の 3 次元の配列です．ここでは直前の 1 語目 w₁ ごとに ${V} × ${V} の面 (行 w₂，列 y) に切って並べました．`,
  `面を w₁ の順に縦に積むと，${V * V} 行 × ${V} 列の縦長の表 (行 = 直前 2 語)．右は青い枠の拡大．`,
  `${V * V} 行のうち，観測されたのは青い印の ${R} 行だけ．右の欄で N と語彙を変えると，行の数が一気に増える．`,
  '行と列の順番だけを変える (数字は変わらない)．似たものを隣に置くと帯が見え，? も隣から見積もれる．',
  '並べ替えた表の行 (文脈) を縦軸，列 (次の語) を横軸の等間隔の座標に置き，値を格子点の色にします．格子点の間を，格子点を必ず通る面でつなぐと，おおよそはつながりますが等高線はぐにゃぐにゃで，穴の値は当てになりません．',
  '表のマス (上と左の帯) はそのままで，座標の目盛りだけを伸び縮みさせる (似たものは詰め，違うものは離す．順番は変えない)．同じ滑らかな簡単な関数 (exp(座標の 2 次式)) が，伸縮するほどよく当てはまる．文脈も語も 1 次元の座標にした特殊な例．',
  '前の場面の関数 (exp(座標の 2 次式)) の値を格子点で読み直して表に戻した．穴だった所 (枠) にも値が入り，観測した値も少し変わる (平滑化)．表に行の無い kids heat も，座標を語から作れば (heat の座標 + kids のずれ) 同じ関数から読める．',
  '文脈 x と語 y を同じ 2 次元の空間のベクトル 𝐱 (矢印)，𝐲 (点) で表し，p(y | x) = softmax ⟨𝐱, 𝐲⟩ とする．⟨𝐱, 𝐲⟩ は点を矢印の向きに射影した長さ × 矢印の長さ．矢印の先をドラッグすると右の確率が変わる．表に行の無い kids heat も，矢印 (heat + kids のずれ) があれば読める．これを高次元にしたものが LLM の出力層 (多クラスのロジスティック回帰)．',
  `log p(y | x) を 2 次関数 α + βx + γy + δx² + εxy + ζy² で書き (x: 文脈の座標，y: 語の座標)，表の行ごと (y について) に和を 1 にすると，x だけの項は消え p(y | x) ∝ exp(εxy + γy + ζy²)．文脈と語を結ぶのは xy の項だけ．多次元にすると内積 ⟨𝐱, 𝐲⟩ になる．左: スコアは x の直線．右: 確率の曲線と観測した点 (誤差 ${D.softmax.rmse.toFixed(1)} %)．`];
let step = 0;
const QP = new URLSearchParams(location.search), clampS = n => Math.max(0, Math.min(stages.length - 1, n));
const LO = clampS((+QP.get('from') || 1) - 1), HI = Math.max(LO, clampS((+QP.get('to') || stages.length) - 1));   // ?from=&to= で場面の範囲を限る (スライドのブロックごとに)
const stepsNav = $('#steps');
stages.forEach((s, i) => { const b = document.createElement('button'); b.textContent = `${i + 1} ${s}`; b.addEventListener('click', () => go(i)); if (i < LO || i > HI) b.style.display = 'none'; stepsNav.append(b); });

// ---------------------------------------------------------------- 表 (svg): 場面 1〜5
const svg = $('#table');
const C = 4;                                   // 1 セルの大きさ (svg の単位)
const root = el('g', { id: 'root' }, svg);
// 2-gram
const g2 = el('g', { class: 'fade' }, root);
for (let a = 0; a < V; a++) for (let c = 0; c < V; c++) {
  const v = D.big2[a][c];
  el('rect', { x: c * C + .15, y: a * C + .15, width: C - .3, height: C - .3, rx: .4, 'data-v': v }, g2);
  if (v > 0) { const t = el('text', { x: c * C + C / 2, y: a * C + C / 2, class: 'val', 'data-tv': v, style: 'font-size:1.5px' }, g2); t.textContent = v; }
}
D.vocab.forEach((w, k) => {
  const t1 = el('text', { x: -.8, y: k * C + C / 2 + 1.1, class: 'lab ' + D.cat[k], 'text-anchor': 'end' }, g2); t1.textContent = w;
  const t2 = el('text', { x: k * C + C / 2, y: -1, class: 'lab ' + D.cat[k], transform: `rotate(-60 ${k * C + C / 2} -1)` }, g2); t2.textContent = w;
});
{ const t = el('text', { x: V * C / 2, y: V * C + 5, class: 'lab', 'text-anchor': 'middle', style: 'font-size:3.4px;fill:var(--text-primary)' }, g2); t.textContent = '行: 直前の語 w₁　列: 次の語 y'; }

// 3-gram の 169 行 (行ごとの g と，その中の 13 セル)．場面 2 は面に，場面 3〜4 は横長 (列 = 文脈) に，拡大した表は縦 (行 = 文脈) に置く
const g3 = el('g', { class: 'fade', id: 'g3' }, root);
const rowsG = [];
for (let a = 0; a < V; a++) for (let b = 0; b < V; b++) {
  const ri = a * V + b, oi = rowOfIndex.get(ri);
  const g = el('g', { class: 'rowg' }, g3);
  const cells = [];
  for (let c = 0; c < V; c++) {
    let v = 0, hole = false, isObj = false;
    if (oi !== undefined) { const j = objCol.indexOf(c); if (j >= 0) { isObj = true; v = D.values[oi][j]; hole = isHole(oi, j); } }
    const r = el('rect', { class: 'cell', x: .1, y: .1, width: C - .2, height: C - .2, rx: .3, 'data-v': v, ...(hole ? { 'data-hole': 1 } : {}) }, g);
    let t = null;
    if (isObj) {
      t = el('text', { class: 'val', x: C / 2, y: C / 2, 'data-tv': v, ...(hole ? { 'data-hole': 1 } : {}), opacity: 0 }, g);
      t.textContent = hole ? '?' : v;
    }
    cells.push({ r, t, c });
  }
  const lab = el('text', { class: 'lab rowlab', 'text-anchor': 'end', style: 'font-size:2.3px' }, g);
  lab.textContent = `${D.vocab[a]} ${D.vocab[b]}`;
  rowsG.push({ g, a, b, ri, oi, cells, lab });
}
// 面の名前 (場面 2)，縦長の表の w₁ の区切り (場面 3, 4)．行 = 文脈 (直前の語の並び)，列 = 次の語 にそろえる
const sliceLabels = el('g', { class: 'fade' }, root);
const stackLabels = el('g', { class: 'fade' }, root);
const SW = V * C + 6, COLS2 = 7;                              // 場面 2 は 7 枚ずつ 2 段
const slicePos = a => [(a % COLS2) * SW, Math.floor(a / COLS2) * (V * C + 14)];
D.vocab.forEach((w, a) => {
  const [x, y] = slicePos(a);
  const t = el('text', { x: x + V * C / 2, y: y - 2, class: 'lab ' + D.cat[a], 'text-anchor': 'middle', style: 'font-size:4.6px' }, sliceLabels); t.textContent = `w₁ = ${w}`;
  const t2 = el('text', { x: -2, y: a * V * C + V * C / 2 + 2, class: 'lab ' + D.cat[a], 'text-anchor': 'end', style: 'font-size:6.5px' }, stackLabels); t2.textContent = `${w} ＊`;
  el('line', { x1: -2, x2: V * C + 2, y1: a * V * C, y2: a * V * C, stroke: 'var(--text-muted)', 'stroke-width': .4 }, stackLabels);
});
{ const t = el('text', { x: V * C + 6, y: 8, class: 'lab', style: 'font-size:6px;fill:var(--text-primary)' }, stackLabels);

<script>/* 説明の拡大表示: XP_SRC に並べた要素の中身を大きな窓に写す */

  function visible(e) { return e.offsetParent !== null && e.textContent.trim() !== ''; }
  function fill() {
    body.innerHTML = '';

      var c = p[0].cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('[id]').forEach(function (x) { x.removeAttribute('id'); });
      c.querySelectorAll('input,select,button,textarea').forEach(function (x) { x.remove(); });

    if (ov.contains(e.target) || e.target.closest('button,input,select,a,label,svg,canvas,textarea,.js-plotly-plot')) return;
    if (e.target.closest('.xp-src')) open();
  });
})();</script>
