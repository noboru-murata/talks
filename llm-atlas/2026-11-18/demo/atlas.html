<html lang="ja">

(function () { var t = new URLSearchParams(location.search).get('theme'); document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; })();</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Atlas Viewer</title>
<!--
  atlas.html — 座標の CSV を読んで地図を表示するだけのビューア (座標の計算はしない)．
  使い方と CSV の形は README.org．Plotly は vendor/ に同梱 (ネットなしで動く)．
-->
<script src="vendor/plotly-2.35.2.min.js"></script>
<script src="sample/sample.js"></script>
<script>/* ?set=名前 で sets/名前.js (window.ATLAS_SET) を読む */
(function () { var n = new URLSearchParams(location.search).get("set"); if (n && /^[\w-]+$/.test(n)) document.write('<script src="sets/' + n + '.js"><\/script>'); })();</script>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --surface-2: #efeeea;
  --line: #dddbd5;
  --grid: #e9e7e2;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7c7b76;
  --accent: #2a78d6;
  --dim: #c9c7c0;
  --other: #9a9893;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --seq-lo: #cde2fb; --seq-mid: #3987e5; --seq-hi: #0d366b;
  --ring: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422;
    --line: #34332f; --grid: #2a2a27;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5; --dim: #3d3c38; --other: #77766f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --seq-lo: #104281; --seq-mid: #3987e5; --seq-hi: #cde2fb;
    --ring: #f0efec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422;
  --line: #34332f; --grid: #2a2a27;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --accent: #3987e5; --dim: #3d3c38; --other: #77766f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --seq-lo: #104281; --seq-mid: #3987e5; --seq-hi: #cde2fb;
  --ring: #f0efec;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface-1);
}
header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
header .grow { flex: 1; }
button, select, input[type=search], input[type=number] {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
}
button { cursor: pointer; }
button:hover { background: var(--surface-2); }
button.on { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
main { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
aside {
  border-right: 1px solid var(--line); background: var(--surface-1);
  overflow-y: auto; padding: 12px 14px; min-height: 0;
}
aside h2 { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 14px 0 6px; letter-spacing: .04em; }
aside h2:first-child { margin-top: 0; }
aside select, aside input[type=search] { width: 100%; }
.muted { color: var(--text-muted); font-size: 12px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#legend .item { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; user-select: none; }
#legend .item.off { opacity: .4; }
#legend .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#legend .n { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }
#legend .bar { height: 10px; border-radius: 3px; margin: 4px 0 2px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-1); }
.card table { border-collapse: collapse; width: 100%; font-size: 12px; }
.card td { padding: 1px 4px 1px 0; vertical-align: top; word-break: break-all; }
.card td:first-child { color: var(--text-muted); white-space: nowrap; word-break: normal; }
.card .title { font-weight: 600; word-break: break-all; }
.nb { font-size: 12px; columns: 2; column-gap: 10px; }
.nb div { break-inside: avoid; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb .both { font-weight: 600; }
.link { color: var(--accent); cursor: pointer; text-decoration: underline; }
#sellist div { cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 0; }
#panes.single { grid-template-columns: 1fr; }
#panes.single .pane[data-p="b"] { display: none; }
.pane .cond { max-width: 26em; font: inherit; }
.pane .evalv { position: absolute; left: 10px; bottom: 6px; z-index: 5; font-size: 13px; color: var(--text-muted); background: var(--surface-1); padding: 1px 6px; border-radius: 4px; pointer-events: none; }
.pane { display: grid; grid-template-rows: auto 1fr; background: var(--surface-1); min-width: 0; min-height: 0; position: relative; }
.pane .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
.pane .bar .name { font-weight: 600; font-size: 13px; margin-right: 4px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane .bar select { padding: 1px 4px; font-size: 12px; }
.plot { min-height: 0; min-width: 0; }
.drop {
  position: absolute; inset: 40px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: var(--text-secondary); text-align: center; padding: 24px; pointer-events: none;
}
.pane.dragover .drop, .pane.empty .drop { pointer-events: auto; }
.pane.dragover { outline: 2px dashed var(--accent); outline-offset: -4px; }
.pane:not(.empty):not(.dragover) .drop { display: none; }
.pane.dragover .drop { background: color-mix(in srgb, var(--surface-1) 85%, transparent); }
#compare { font-size: 12px; color: var(--text-secondary); }
#timebox input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
#timebox .now { font-variant-numeric: tabular-nums; font-weight: 600; }
.pane .bar .cams button { padding: 1px 6px; font-size: 12px; }
.pane .bar .cams[hidden] { display: none; }
.pane .bar label.tl.off { opacity: .4; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text-primary); color: var(--surface-1);
  padding: 6px 12px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: .92; }
input[type=file] { display: none; }
@media (max-width: 860px) {
  body { overflow: auto; }
  main { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); order: 2; }
  #panes, #panes.single { grid-template-columns: 1fr; grid-auto-rows: 70vh; }
}
</style>

<body>
<header>
  <h1>LLM Atlas Viewer</h1>
  <span class="seg" title="地図の枚数">
    <button id="lay1">1 枚</button><button id="lay2" class="on">2 枚</button>
  </span>
  <button id="sampleBtn" title="作り物のデータで試す">サンプル</button>
  <span id="compare"></span>
  <span class="grow"></span>
  <button id="themeBtn" title="明暗の切替">明暗</button>
</header>
<main>
  <aside>
    <h2>検索</h2>
    <input type="search" id="search" list="idlist" placeholder="id・名前 (Enter で選択)">
    <datalist id="idlist"></datalist>

    <h2>色分け</h2>
    <select id="colorBy"></select>
    <div class="row" style="margin-top:6px">
      <label class="muted"><input type="checkbox" id="hideOff"> 絞り込みで外した点を隠す</label>
    </div>
    <div class="row">
      <label class="muted">点の大きさ <input type="number" id="ptSize" min="3" max="20" value="8" style="width:56px"></label>
      <label class="muted"><input type="checkbox" id="showLabels" checked> 選んだ点に名前</label>
    </div>
    <div id="legend" style="margin-top:8px"></div>

    <h2>時間</h2>
    <div id="timebox" class="muted">時間の列 (release_date，date，year など) があると使える．</div>

    <h2>選んだ点</h2>
    <div id="selbox" class="muted">点をクリック (Shift で追加)，または 2D の地図で投げ縄・矩形で囲む．</div>

    <h2>詳細</h2>
    <div id="cardbox" class="muted">点をクリックすると表示．</div>
  </aside>
  <section id="panes">
    <div class="pane empty" data-p="a">
      <div class="bar">
        <span class="name">A</span>
        <select class="cond" hidden title="地図の作り方 (特徴量)"></select>
        <button class="open">CSV を開く</button>
        <label>x <select class="cx"></select></label>
        <label>y <select class="cy"></select></label>
        <label>z <select class="cz"></select></label>
        <label class="tl off" title="時間を 3 本目の軸 (縦) にする．2 次元の地図が時間の順に積み重なる"><input type="checkbox" class="ct" disabled> 時間軸</label>
        <span class="cams seg" hidden><button data-cam="top" title="時間の軸に沿って上から (元の 2 次元の地図)">上</button><button data-cam="side" title="横から (時間が縦)">横</button><button data-cam="iso" title="斜めから">斜</button></span>
        <button class="fit" title="全体を表示">全体</button>
        <input type="file" accept=".csv,.tsv,.txt,text/csv">
      </div>
      <div class="evalv" hidden></div>
      <div class="plot"></div>
      <div class="drop"><div>座標の CSV をここへドロップ</div><div class="muted">または「CSV を開く」．列の形は README.org</div></div>
    </div>
    <div class="pane empty" data-p="b">
      <div class="bar">
        <span class="name">B</span>
        <select class="cond" hidden title="地図の作り方 (特徴量)"></select>
        <button class="open">CSV を開く</button>
        <label>x <select class="cx"></select></label>
        <label>y <select class="cy"></select></label>
        <label>z <select class="cz"></select></label>
        <label class="tl off" title="時間を 3 本目の軸 (縦) にする．2 次元の地図が時間の順に積み重なる"><input type="checkbox" class="ct" disabled> 時間軸</label>
        <span class="cams seg" hidden><button data-cam="top" title="時間の軸に沿って上から (元の 2 次元の地図)">上</button><button data-cam="side" title="横から (時間が縦)">横</button><button data-cam="iso" title="斜めから">斜</button></span>
        <button class="fit" title="全体を表示">全体</button>
        <input type="file" accept=".csv,.tsv,.txt,text/csv">
      </div>
      <div class="evalv" hidden></div>
      <div class="plot"></div>
      <div class="drop"><div>比べる地図の CSV をここへドロップ</div><div class="muted">同じ id の点が A と連動する</div></div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
"use strict";
// ============================================================ 状態
var PANES = ["a", "b"];
var S = {
  maps: { a: null, b: null },      // {name, header, rows:[obj], byId:Map, xcol, ycol, zcol, numeric:{col:bool}}
  attrs: new Map(),                // id -> {col: value} (A を優先，B で補う)
  attrCols: [], attrNumeric: {},   // 属性の列と，数値かどうか
  colorBy: "", hidden: new Set(),  // 絞り込みで外した値 (カテゴリのとき)
  cats: [],                        // [{v, n, color}] (色分けのカテゴリ．件数順に 8 色，残りは「その他」)
  selected: new Set(), focus: null, hoverId: null,
  layout: 2, ptSize: 8, hideOff: false, showLabels: true,
  idLabel: new Map(),
  knnScore: null,
  // 時間: col (列), byId (id → 小数の年), min/max, isDate, mode ("all" すべて / "cum" t まで / "win" t の前 win 年), t, win,
  //       parentCol (系譜の列), lineage (系譜の線), slices (年ごとの断面)
  time: { col: "", byId: new Map(), min: 0, max: 0, isDate: false, mode: "all", t: 0, win: 1, parentCol: "", lineage: true, slices: true, timer: null },
  // 時間で色分け: timeShade = 系列 (区分) の色を残し，古いほど淡くする．timeKeep = 「系列の色を残す」(既定は残す)
  timeShade: false, timeKeep: true,
};
var TIME_NAMES = ["release_date", "released", "release", "date", "created", "created_at", "published", "year", "time", "t"];
var PARENT_NAMES = ["parent", "parent_id", "base_model", "base", "finetuned_from", "derived_from"];
var ID_NAMES = ["id", "model", "model_id", "name", "repo", "hf_id"];
var LABEL_NAMES = ["label", "short", "short_name", "display", "name"];
var URL_NAMES = ["url", "link", "href"];
var HF_NAMES = ["hf_id", "repo", "hf_repo"];
var MAX_CATS = 8;

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function toast(msg) { var t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 2600); }
function isNum(v) { return v !== "" && v != null && isFinite(Number(v)); }
function fmt(v) {
  if (!isNum(v)) return v; var x = Number(v);
  if (Number.isInteger(x)) return String(x);
  return Math.abs(x) >= 1000 ? x.toFixed(1) : x.toPrecision(4).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
}

// ============================================================ 時間
// 年 (2024)，年月 (2024-03)，年月日 (2024-03-15，2024/3/15) を小数の年にする．それ以外の数値はそのまま
function parseTime(v) {
  if (v == null || v === "") return null;
  var m = String(v).trim().match(/^(\d{4})(?:[-\/.](\d{1,2})(?:[-\/.](\d{1,2}))?)?/);
  if (m && (m[2] || !isNum(v) || (Number(v) >= 1900 && Number(v) <= 2200 && Number.isInteger(Number(v))))) {
    var y = +m[1], mo = m[2] ? +m[2] - 1 : 0, d = m[3] ? +m[3] : 1;
    var t0 = Date.UTC(y, 0, 1), t1 = Date.UTC(y + 1, 0, 1), tt = Date.UTC(y, mo, d);
    return y + (tt - t0) / (t1 - t0);
  }
  return isNum(v) ? Number(v) : null;
}
function fmtTime(t) {
  if (t == null || !isFinite(t)) return "";
  if (!S.time.isDate) return fmt(Math.round(t * 100) / 100);
  var y = Math.floor(t), mo = Math.floor((t - y) * 12 + 1e-6) + 1;
  return y + "-" + (mo < 10 ? "0" : "") + mo;
}
function detectTime() {
  var T = S.time, old = T.col;
  var cand = S.attrCols.filter(function (h) { return TIME_NAMES.indexOf(h.toLowerCase()) >= 0; });
  cand.sort(function (a, b) { return TIME_NAMES.indexOf(a.toLowerCase()) - TIME_NAMES.indexOf(b.toLowerCase()); });
  if (old && S.attrCols.indexOf(old) >= 0) cand.unshift(old);
  T.col = ""; T.byId = new Map();
  for (var k = 0; k < cand.length; k++) {
    var col = cand[k], by = new Map(), n = 0, dateLike = false;
    S.attrs.forEach(function (o, id) { var t = parseTime(o[col]); if (t != null) { by.set(id, t); n++; if (/[-\/]/.test(o[col])) dateLike = true; } });
    if (n >= Math.max(2, S.attrs.size * 0.3)) { T.col = col; T.byId = by; T.isDate = dateLike || (S.attrNumeric[col] === true && Array.from(by.values()).every(function (t) { return t >= 1900 && t <= 2200; })); break; }
  }
  if (T.col) {
    var ts = Array.from(T.byId.values());
    T.min = Math.min.apply(null, ts); T.max = Math.max.apply(null, ts);
    if (T.col !== old) { T.t = T.max; T.mode = "all"; }
    T.t = Math.min(Math.max(T.t, T.min), T.max);
  }
  T.parentCol = findCol(S.attrCols, PARENT_NAMES) || "";
}
function timeOf(id) { return S.time.col ? S.time.byId.get(id) : undefined; }
// 時間の絞り込みで外れるか (時間の無い点は外さない)
function timeOff(id) {
  var T = S.time, t = timeOf(id);
  if (!T.col || T.mode === "all" || t == null) return false;
  if (t > T.t + 1e-9) return true;
  return T.mode === "win" && t < T.t - T.win - 1e-9;
}

// ============================================================ CSV
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  var first = text.split(/\r?\n/, 1)[0];
  var sep = (first.split("\t").length > first.split(",").length) ? "\t" : ",";
  var rows = [], row = [], f = "", q = false, i = 0, n = text.length, c;
  while (i < n) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); f = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = [];
    } else f += c;
    i++;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  if (!rows.length) throw new Error("空の CSV");
  var header = rows[0].map(function (h, k) { return h.trim() || ("col" + (k + 1)); });
  var data = rows.slice(1).map(function (r) {
    var o = {}; header.forEach(function (h, k) { o[h] = (r[k] == null ? "" : r[k].trim()); }); return o;
  });
  return { header: header, rows: data };
}

function findCol(header, names) {
  var low = header.map(function (h) { return h.toLowerCase(); });
  for (var k = 0; k < names.length; k++) { var j = low.indexOf(names[k]); if (j >= 0) return header[j]; }
  return null;
}

// 座標の列の推定: x/y/z → 名前に番号の付いた数値列 (tsne1, umap_2, PC1, PHATE1 …) → 最初の数値列
function guessCoords(header, numeric, idCol) {
  var nums = header.filter(function (h) { return numeric[h] && h !== idCol; });
  var low = function (h) { return h.toLowerCase(); };
  var x = nums.find(function (h) { return low(h) === "x"; }), y = nums.find(function (h) { return low(h) === "y"; });
  var z = nums.find(function (h) { return low(h) === "z"; });
  if (x && y) return [x, y, z || ""];
  var re = /^(.*?)[\s_\-.]?([123])$/;
  var groups = {};
  nums.forEach(function (h) { var m = low(h).match(re); if (m && /(tsne|t-sne|umap|phate|pc|pca|mds|dim|comp|component|coord|emb|isomap|lle|axis|x)$/.test(m[1])) { (groups[m[1]] = groups[m[1]] || {})[m[2]] = h; } });
  for (var g in groups) if (groups[g]["1"] && groups[g]["2"]) return [groups[g]["1"], groups[g]["2"], groups[g]["3"] || ""];
  if (nums.length >= 2) return [nums[0], nums[1], ""];
  return ["", "", ""];
}

function loadSetMap(p, id) {
  var st = window.ATLAS_SET, e = st && st.maps[id]; if (!e) return;
  loadMap(p, e.label, e.csv);
  var pane = $('.pane[data-p="' + p + '"]'), m = S.maps[p]; if (!m) return;
  m.setId = id; m.xcol = "x"; m.ycol = "y"; m.zcol = "";   // 既定は 2 次元の地図 (3 次元は x3, y3, z)
  $(".cond", pane).value = id; setupPaneBar(p); refreshAll(true);

function knn(m, id, k) {

    d.sort(function (x, y) { return x[0] - y[0]; });
    return d.slice(0, k).map(function (e) { return e[1]; });
  }
  var tot = 0;
  common.forEach(function (id) { var na = new Set(nb(a, id)); tot += nb(b, id).filter(function (j) { return na.has(j); }).length / k; });
  S.knnScore = { k: k, n: common.length, v: tot / common.length, onlyA: a.rows.length - common.length, onlyB: b.rows.length - common.length };
}

  $("#tSlice").onchange = function (ev) { T.slices = ev.target.checked; refreshAll(); };
  // 時間で色分け: 「系列の色を残す」なら区分の色のまま古いほど淡く，残さないなら色分けを「時間」(青の濃淡) に．外すと前の色分けに戻す
  $("#tColor").onchange = function (ev) { applyTimeColor(ev.target.checked, S.timeKeep); };
  if ($("#tKeep")) $("#tKeep").onchange = function (ev) { S.timeKeep = ev.target.checked; applyTimeColor(true, S.timeKeep); };
}
function prevCatColorBy() {
  var vals = $$("#colorBy option").map(function (o) { return o.value; });
  return (S.prevColorBy && S.prevColorBy !== "time:" && vals.indexOf(S.prevColorBy) >= 0) ? S.prevColorBy
    : (vals.find(function (x) { return x.indexOf("cat:") === 0; }) || "");
}
function applyTimeColor(on, keep) {
  var v = S.colorBy;
  if (S.colorBy !== "time:") S.prevColorBy = S.colorBy;
  if (!on) { S.timeShade = false; if (v === "time:") v = prevCatColorBy(); }
  else if (keep) { S.timeShade = true; if (v === "time:" || v.indexOf("cat:") !== 0) v = prevCatColorBy(); }
  else { S.timeShade = false; v = "time:"; }
  S.colorTouched = true; $("#colorBy").value = v;
  setColorBy(v, true);   // 凡例も作り直す
  renderTimeBox(); refreshAll();
}
function refreshTime() { renderTimeBox(); refreshAll(); }
// 再生中・スライダー操作中は欄を作り直さず，値だけ書き換える (ボタンが押せなくならないように)
function refreshTimeLive() {
  var T = S.time, sl = $("#tSlider");
  if (!sl) return refreshTime();
  sl.value = T.t; $("#timebox .now").textContent = fmtTime(T.t);
  var n = 0, all = 0; S.attrs.forEach(function (o, id) { if (timeOf(id) != null) { all++; if (!timeOff(id)) n++; } });
  $("#timebox .cnt").textContent = (T.mode === "all" ? all : n) + " / " + all + " 点";
  $$("#timebox [data-mode]").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === T.mode); });
  refreshAll();
}
// スライダーを動かしている間は描き直しを 1 フレームに 1 回に
function scheduleTime() {
  if (scheduleTime.raf) return;
  scheduleTime.raf = requestAnimationFrame(function () { scheduleTime.raf = 0; refreshTimeLive(); });
}
function startPlay() {
  var T = S.time; if (!T.col) return;
  if (T.mode === "all") T.mode = "cum";
  if (T.t >= T.max - 1e-9) T.t = T.min;
  refreshTime();
  var step = T.isDate ? 1 / 12 : (T.max - T.min) / 60;
  T.timer = setInterval(function () {
    T.t = Math.min(T.max, T.t + step);
    refreshTimeLive();
    if (T.t >= T.max - 1e-9) { stopPlay(); renderTimeBox(); }
  }, 160);
}
function stopPlay() { if (S.time.timer) { clearInterval(S.time.timer); S.time.timer = null; } }

// ============================================================ 初期化
function init() {
  PANES.forEach(bindPane);
  $("#lay1").onclick = function () { setLayout(1); };
  $("#lay2").onclick = function () { setLayout(2); };
  $("#colorBy").onchange = function (ev) {
    S.colorTouched = true; if (S.colorBy !== "time:") S.prevColorBy = S.colorBy;
    if (ev.target.value === "time:") { S.timeShade = false; S.timeKeep = false; }
    else if (!S.timeShade) S.timeKeep = true;   // 既定 (系列の色を残す) に戻す
    setColorBy(ev.target.value); renderTimeBox();
  };
  $("#hideOff").onchange = function (ev) { S.hideOff = ev.target.checked; refreshAll(); };
  $("#ptSize").onchange = function (ev) { S.ptSize = Math.max(3, Math.min(20, Number(ev.target.value) || 8)); refreshAll(); };
  $("#showLabels").onchange = function (ev) { S.showLabels = ev.target.checked; refreshAll(); };
  $("#search").addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    var q = ev.target.value.trim(); if (!q) return;
    if (S.attrs.has(q)) return choose(q, true);
    var ql = q.toLowerCase(), hit = Array.from(S.idLabel.entries()).filter(function (e) { return e[0].toLowerCase().indexOf(ql) >= 0 || String(e[1]).toLowerCase().indexOf(ql) >= 0; });
    if (!hit.length) return toast("見つかりません: " + q);
    if (hit.length === 1) return choose(hit[0][0], true);
    S.selected = new Set(hit.map(function (e) { return e[0]; })); S.focus = null; refreshAll(); toast(hit.length + " 点が一致");
  });
  $("#sampleBtn").onclick = function () {
    if (!window.ATLAS_SAMPLE) { toast("sample/sample.js が見つかりません"); return; }
    loadMap("a", "sample-a.csv", window.ATLAS_SAMPLE["sample-a.csv"]);
    loadMap("b", "sample-b.csv", window.ATLAS_SAMPLE["sample-b.csv"]);
  };
  $("#themeBtn").onclick = function () {
    var dark = getComputedStyle(document.documentElement).colorScheme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    renderLegend(); refreshAll();
  };
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { renderLegend(); refreshAll(); });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && document.activeElement.tagName !== "INPUT") { S.selected = new Set(); S.focus = null; refreshAll(); }
  });
  // ?a=…&b=… で CSV を読む (http で配るとき)．?sample でサンプル
  var qs = new URLSearchParams(location.search);
  // ?set=… のとき: 組の中の地図を選ぶ (?a=条件&b=条件)．ファイルでも開ける
  if (window.ATLAS_SET) {
    var ST = window.ATLAS_SET, ids = Object.keys(ST.maps);
    PANES.forEach(function (p, k) {
      var pane = $('.pane[data-p="' + p + '"]'), sel = $(".cond", pane);
      sel.innerHTML = ids.map(function (id) { return '<option value="' + esc(id) + '">' + esc(ST.maps[id].label) + '</option>'; }).join("");
      sel.hidden = false; $(".open", pane).hidden = true;
      sel.onchange = function () { loadSetMap(p, sel.value); };
      var id = qs.get(p); if (!ST.maps[id]) id = (ST.default || ids)[k] || ids[0];
      loadSetMap(p, id);
    });
  }
  else PANES.forEach(function (p) {
    var u = qs.get(p); if (!u) return;
    fetch(u).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) { loadMap(p, u.split("/").pop(), t); })
      .catch(function (e) { toast(u + " を読めません (" + e.message + ")"); });
  });
  if (qs.has("sample")) $("#sampleBtn").click();
  if (qs.get("layout") === "1") setLayout(1);
  PANES.forEach(function (p) { setupPaneBar(p); });
}
init();
// 組の段 (ATLAS_SET.steps) をスライドの頁送りで進める (?embed．embed.js)．各段は {cap, a, b, sel} で状態をまるごと決める
if (window.ATLAS_SET && window.ATLAS_SET.steps && window.ATLAS_SET.steps.length) {
  var ATLAS_K = 0;
  var atlasApply = function (k) {
    var s = window.ATLAS_SET.steps[k]; ATLAS_K = k;
    PANES.forEach(function (p) { var id = s[p]; if (id && (!S.maps[p] || S.maps[p].setId !== id)) loadSetMap(p, id); });
    if (s.sel) choose(s.sel); else { S.selected = new Set(); S.focus = null; refreshAll(); }
    if (window.embedCaption) window.embedCaption(s.cap);
  };
  window.demoSteps = {
    next: function () { if (ATLAS_K >= window.ATLAS_SET.steps.length - 1) return false; atlasApply(ATLAS_K + 1); return true; },
    prev: function () { if (ATLAS_K <= 0) return false; atlasApply(ATLAS_K - 1); return true; },
    start: function () { atlasApply(0); }, end: function () { atlasApply(window.ATLAS_SET.steps.length - 1); }
  };
}
</script>

<div id="xpOv"><div id="xpBox"><button class="xp-close" title="閉じる (Esc)">×</button><div class="xp-body" id="xpBody"></div>
<div class="xp-hint">説明を大きく表示 (i または Esc で閉じる．← → の操作はそのまま効く)</div></div></div>
<script>/* 説明の拡大表示: XP_SRC に並べた要素の中身を大きな窓に写す */
(function () {
  var SRC = window.XP_SRC || [], ov = document.getElementById('xpOv'), body = document.getElementById('xpBody'), obs = null;
  function els() { var out = []; SRC.forEach(function (s) { document.querySelectorAll(s[0]).forEach(function (e) { out.push([e, s[1]]); }); }); return out; }
  function visible(e) { return e.offsetParent !== null && e.textContent.trim() !== ''; }
  function fill() {
    body.innerHTML = '';
    els().forEach(function (p) { if (!visible(p[0])) return;
      var sec = document.createElement('div'); sec.className = 'xp-sec';
      if (p[1]) { var h = document.createElement('div'); h.className = 'xp-h'; h.textContent = p[1]; sec.append(h); }
      var c = p[0].cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('[id]').forEach(function (x) { x.removeAttribute('id'); });
      c.querySelectorAll('input,select,button,textarea').forEach(function (x) { x.remove(); });
      c.classList.remove('xp-src'); c.style.maxHeight = 'none'; c.style.overflow = 'visible'; c.style.border = '0'; c.style.cursor = 'auto';
      sec.append(c); body.append(sec); });
    if (!body.children.length) body.textContent = '(この場面の説明はありません)';
  }
  function open() { fill(); ov.classList.add('show');
    obs = new MutationObserver(function () { clearTimeout(obs.t); obs.t = setTimeout(fill, 60); });
    els().forEach(function (p) { obs.observe(p[0], { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['style', 'class'] }); }); }
  function close() { ov.classList.remove('show'); if (obs) obs.disconnect(); obs = null; }
  function toggle() { ov.classList.contains('show') ? close() : open(); }
  var b = document.createElement('button'); b.id = 'xpBtn'; b.textContent = '説明 ⤢'; b.title = '説明を大きく表示 (i)'; b.onclick = toggle;
  var tb = document.getElementById('themeBtn'); if (tb) tb.before(b); else document.body.append(b);
  ov.addEventListener('click', function (e) { if (e.target === ov || e.target.classList.contains('xp-close')) close(); });
  addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === 'i' && !e.metaKey && !e.ctrlKey && !e.altKey) { toggle(); e.preventDefault(); }
    else if (e.key === 'Escape' && ov.classList.contains('show')) { close(); e.stopImmediatePropagation(); }
  }, true);
  els().forEach(function (p) { p[0].classList.add('xp-src'); p[0].title = p[0].title || 'クリックで説明を大きく表示'; });
  document.addEventListener('click', function (e) {
    if (ov.contains(e.target) || e.target.closest('button,input,select,a,label,svg,canvas,textarea,.js-plotly-plot')) return;
    if (e.target.closest('.xp-src')) open();
  });
})();</script>
