title: Transformer における attention 機構の仕組み
subtitle: 情報の流れを見る
lang: ja
authors:
- name: 村田 昇
abstract: 'Transformer モデルは，Multi-Head Attention (MHA) と Multi-Layer Perceptron (MLP) の組み合わせで構成され， MHA はトークン間の複雑な関係を捉え，MLP は非線形性を導入することで表現力を高めている． Transformer の内部処理を理解するための方法の一つとして，Integrated Gradients (IG) と Layer-wise Relevance Propagation (LRP) を組み合わせた解釈手法を紹介する．

  '
